name: build
on: [push, pull_request, workflow_dispatch]
# A newer push replaces a build still running, so an older build can't finish last and become "latest".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # publish the latest-build release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get FFmpeg (LGPL, shared)
        shell: pwsh
        run: |
          $name = "ffmpeg-n8.1-latest-win64-lgpl-shared-8.1"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          Rename-Item $name ffmpeg
          Get-ChildItem ffmpeg/lib, ffmpeg/bin | Select-Object -ExpandProperty Name

      - run: cmake -B build -A x64 -DFFMPEG_DIR="${{ github.workspace }}/ffmpeg"
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/Clip.exe, build/Release/*.dll, LICENSE, README.md dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Clip
          path: dist

      # install.sh downloads releases/latest/download/Clip.zip, which needs no GitHub login.
      - name: Publish as the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive dist/* Clip.zip
          $notes = "Built from ${{ github.sha }}. Install or update: see README."
          # Updated in place rather than deleted and recreated, so the download link never 404s.
          gh release view latest-build *> $null
          if ($LASTEXITCODE -eq 0) {
            git tag -f latest-build ${{ github.sha }}
            git push -f origin refs/tags/latest-build
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release upload latest-build Clip.zip --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit latest-build --latest --notes $notes
          } else {
            gh release create latest-build Clip.zip --target ${{ github.sha }} --latest --title "Latest build" --notes $notes
          }
